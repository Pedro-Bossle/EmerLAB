<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft · EmerLAB</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        background: #f4f8fb;
        color: #4a6578;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <p>Conectando ao Microsoft…</p>
    <script>
      (function () {
        var hash = window.location.hash || ''
        var search = window.location.search || ''
        var temResposta =
          hash.length > 1 || /[?&](code|error|client_info|session_state)=/i.test(search)

        // Popup: o MSAL da janela pai lê o hash/query — NÃO redirecionar.
        var ehPopup = !!(window.opener && window.opener !== window)
        if (ehPopup) return

        // Redirect (janela principal): leva a resposta à SPA na Home.
        // A Home chama handleRedirectPromise (sem o Supabase a roubar o ?code=).
        if (temResposta) {
          window.location.replace('/home' + search + hash)
          return
        }
        window.location.replace('/home')
      })()
    </script>
  </body>
</html>
